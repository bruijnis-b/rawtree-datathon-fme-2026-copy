# Two-tower embedding model (python -m training.train). See docs/EMBED_SWEEPS_FINAL.md.
defaults:
  - default
  - _self_

preset: default  # named one-axis variant (training/embed/presets.py); applied on top of the settings below

data:
  fold: 0        # 0, 1, 2: held-out users and products; a repeat, not a design choice
  all: false     # true: train on all days, no held-out users or products (final model)

model:
  dim: 64
  hidden: 128
  id_dropout: 0.25
  history_dropout: 0.3
  history_len: 20
  pooling: recency   # recency | mean | attention
  recency_decay: 0.7
  slot: learned      # learned | fixed | off
  description: false
  price: true

organic:
  mode: joint        # joint | off | staged
  weight: 1.0
  logq: true
  type_weights: [1.0, 3.0, 6.0]  # sampling weight of view, add_to_cart, purchase targets

loss:
  propensity_clip: 0.0  # 0 = off
  click_weight: 1.0

train:
  lr: 0.002
  weight_decay: 1.0e-5
  batch_size: 2048
  epochs: 20
  epoch_fraction: 1.0
  seed: 0

eval:
  every_epoch: true
  bootstrap: 1000
  max_organic: 40000

export:
  user_vectors: true

hydra:
  run:
    dir: ${ivan_run_dir:outputs/hydra/${now:%Y%m%d-%H%M%S}}
  output_subdir: null
  job:
    chdir: false

sweep:
  method: random
  run_cap: 45
  seed: 7
  metric: {name: objective, goal: maximize}
  hypothesis: "Random combinations of the phase-A axes find a better configuration than any one-axis change"
  parameters:
    model.dim: {values: [32, 64, 128]}
    model.id_dropout: {values: [0.0, 0.25, 0.5]}
    model.history_dropout: {values: [0.0, 0.3, 0.5]}
    model.history_len: {values: [0, 20, 50]}
    model.pooling: {values: [recency, mean, attention]}
    organic.mode: {values: [joint, staged]}
    organic.weight: {values: [0.3, 1.0]}
    loss.propensity_clip: {values: [0.0, 0.05, 0.01]}
    loss.click_weight: {values: [0.3, 1.0, 3.0]}
    model.slot: {values: [learned, fixed]}
    model.description: {values: [false, true]}
    train.lr: {values: [0.0007, 0.002, 0.005]}
    train.weight_decay: {values: [0.0, 1.0e-5, 1.0e-4]}
    train.batch_size: {values: [1024, 2048, 4096]}
