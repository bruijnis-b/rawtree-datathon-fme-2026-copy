# Two-tower embedding model (python -m training.train). See docs/EMBED_SWEEPS_FINAL.md.
defaults:
  - default
  - _self_

preset: default  # named one-axis variant (training/embed/presets.py); applied on top of the settings below

data:
  fold: 0        # 0, 1, 2: held-out users and products; a repeat, not a design choice
  all: false     # true: train on all days, no held-out users or products (final model)

model:
  dim: 64
  hidden: 128
  id_dropout: 0.25
  history_dropout: 0.3
  history_len: 20
  pooling: recency   # recency | mean | attention
  recency_decay: 0.7
  slot: learned      # learned | fixed | off
  description: false
  price: true
  no_id_offset: true # learned bias offset for products scored without an ID vector

organic:
  mode: joint        # joint | off | staged
  weight: 1.0
  logq: true
  type_weights: [1.0, 3.0, 6.0]  # sampling weight of view, add_to_cart, purchase targets

loss:
  propensity_clip: 0.0  # 0 = off
  click_weight: 1.0

train:
  lr: 0.002
  weight_decay: 1.0e-5
  batch_size: 2048
  epochs: 20
  epoch_fraction: 1.0
  seed: 0
  calibrate_epochs: 0  # head refit with frozen towers after training (0 = off; did not help, see sweep log)
  score_affine: null   # [a, c]: fixed recalibration (all-data runs); null = fit on the validation week

eval:
  every_epoch: true
  bootstrap: 1000
  max_organic: 40000

export:
  user_vectors: true

hydra:
  run:
    dir: ${ivan_run_dir:outputs/hydra/${now:%Y%m%d-%H%M%S}}
  output_subdir: null
  job:
    chdir: false

sweep:
  # Phase A4 (refined random search around the phase A winners). Phase A2's space is in git history (a3b7c0e^).
  method: random
  run_cap: 150
  seed: 23
  metric: {name: objective, goal: maximize}
  hypothesis: "A refined search around the phase A winners (description on, ID dropout >= 0.25) finds configurations above 3.9 that also rank new products correctly"
  parameters:
    model.description: {value: true}
    model.dim: {values: [32, 48, 64]}
    model.hidden: {values: [128, 192]}
    model.id_dropout: {values: [0.25, 0.4, 0.5, 0.75]}
    model.history_dropout: {values: [0.3, 0.5]}
    model.history_len: {values: [20, 35, 50]}
    model.pooling: {values: [recency, mean]}
    model.slot: {values: [learned, fixed]}
    loss.click_weight: {values: [0.3, 0.6, 1.0]}
    organic.weight: {values: [0.7, 1.0, 1.5]}
    train.lr: {values: [0.0005, 0.0007, 0.001, 0.0015]}
    train.weight_decay: {values: [0.0, 1.0e-5, 1.0e-4, 3.0e-4]}
    train.batch_size: {values: [2048, 4096]}
    train.epochs: {values: [15, 20, 30, 40]}
