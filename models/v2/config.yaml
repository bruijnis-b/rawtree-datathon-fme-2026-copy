wandb:
  project: rawtree
  entity: null
data:
  dataset: rawtree_history
  version: null
  fold: 0
  all: false
history: ${ivan:${data.dataset},${data.version}}
sweep:
  method: random
  run_cap: 150
  seed: 23
  metric:
    name: objective
    goal: maximize
  hypothesis: A refined search around the phase A winners (description on, ID dropout
    >= 0.25) finds configurations above 3.9 that also rank new products correctly
  parameters:
    model.description:
      value: true
    model.dim:
      values:
      - 32
      - 48
      - 64
    model.hidden:
      values:
      - 128
      - 192
    model.id_dropout:
      values:
      - 0.25
      - 0.4
      - 0.5
      - 0.75
    model.history_dropout:
      values:
      - 0.3
      - 0.5
    model.history_len:
      values:
      - 20
      - 35
      - 50
    model.pooling:
      values:
      - recency
      - mean
    model.slot:
      values:
      - learned
      - fixed
    loss.click_weight:
      values:
      - 0.3
      - 0.6
      - 1.0
    organic.weight:
      values:
      - 0.7
      - 1.0
      - 1.5
    train.lr:
      values:
      - 0.0005
      - 0.0007
      - 0.001
      - 0.0015
    train.weight_decay:
      values:
      - 0.0
      - 1.0e-05
      - 0.0001
      - 0.0003
    train.batch_size:
      values:
      - 2048
      - 4096
    train.epochs:
      values:
      - 15
      - 20
      - 30
      - 40
preset: c_a4_25
model:
  dim: 64
  hidden: 128
  id_dropout: 0.4
  history_dropout: 0.3
  history_len: 100
  pooling: recency
  recency_decay: 0.7
  slot: learned
  description: true
  price: true
  no_id_offset: true
organic:
  mode: joint
  weight: 1.0
  logq: true
  type_weights:
  - 1.0
  - 3.0
  - 6.0
loss:
  propensity_clip: 0.0
  click_weight: 0.3
train:
  lr: 0.001
  weight_decay: 0.0
  batch_size: 2048
  epochs: 15
  epoch_fraction: 1.0
  seed: 0
  calibrate_epochs: 0
  score_affine: null
eval:
  every_epoch: true
  bootstrap: 1000
  max_organic: 40000
export:
  user_vectors: true
