[project]
name = "rawtree"
version = "0.1.0"
description = "Team Epoch · RawTree real-time recommendation challenge (Datathon FME 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3",
    "ivan[results] @ git+https://github.com/TeamEpochGithub/ivan@main",
    "duckdb>=1.1",
    "pyarrow>=17",
    "polars>=1.9",
    "requests>=2.32",
    "tqdm>=4.66",
    "pytz>=2026.6",
]

[dependency-groups]
dev = ["jupyter>=1.1", "matplotlib>=3.9"]

[tool.uv]
package = false

[tool.ruff.lint.isort]
known-third-party = ["ivan"]
